version: '3.8'

services:
  backend:
    build: .
    container_name: devlinks-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/devlinks.db
      - SECRET_KEY=your-secret-key-here
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
